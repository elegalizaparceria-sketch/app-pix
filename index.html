<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle PIX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3864">
<style>
  :root{--azul:#1F3864;--azul2:#2c4f8f;--verde:#1e9e5a;--vermelho:#d64545;--cinza:#f3f5f8;--texto:#222;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  html,body{margin:0;padding:0;background:var(--azul);color:var(--texto);min-height:100%;}
  body{padding-bottom:80px;}
  /* ===== SPLASH ===== */
  #splash{position:fixed;inset:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;}
  #splash img{width:120px;height:120px;border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,.3);}
  #splash p{color:#fff;margin-top:16px;font-size:15px;font-weight:600;letter-spacing:.5px;}
  #splash.oculto{opacity:0;pointer-events:none;}
  /* ===== HEADER ===== */
  header{background:var(--azul);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{font-size:19px;}
  header p{font-size:12px;opacity:.85;margin-top:2px;}
  #btnOlho{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  #btnOlho:active{transform:scale(.92);}
  /* ===== TABS ===== */
  nav.tabs{display:flex;background:var(--azul);padding:0 8px 10px;gap:6px;overflow-x:auto;}
  nav.tabs button{flex:1;min-width:72px;padding:10px 4px;border:none;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
  nav.tabs button.ativo{background:#fff;color:var(--azul);}
  main{max-width:720px;margin:0 auto;padding:14px;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .card{background:#fff;border-radius:12px;padding:14px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .card .rotulo{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.4px;}
  .card .valor{font-size:15px;font-weight:700;margin-top:4px;}
  .verde{color:var(--verde);}.vermelho{color:var(--vermelho);}.azul{color:var(--azul);}
  .card-banco{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .card-banco h2{font-size:15px;color:var(--azul);margin-bottom:8px;}
  .card-banco .linhas{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;}
  .grafico{margin-top:10px;}
  .barra-linha{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
  .barra-linha .rot{width:72px;color:#666;flex-shrink:0;}
  .barra{height:18px;border-radius:4px;min-width:2px;}
  /* ===== RELATÓRIOS ===== */
  .relatorio{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .periodo-toggle{display:flex;gap:6px;margin-bottom:12px;}
  .periodo-toggle button{flex:1;padding:10px 4px;border:none;border-radius:8px;background:#eef1f6;color:var(--azul);font-weight:600;font-size:13px;cursor:pointer;}
  .periodo-toggle button.ativo{background:var(--azul);color:#fff;}
  .filtro{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .filtro select{flex:1;min-width:110px;padding:9px 8px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:13px;color:var(--texto);}
  .filtro button{padding:6px 12px;border:1px solid #ccc;border-radius:20px;background:#fff;font-size:12px;cursor:pointer;}
  .filtro button.ativo{background:var(--azul);color:#fff;border-color:var(--azul);}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  th{background:var(--azul);color:#fff;padding:10px 6px;font-size:12px;text-align:center;}
  td{padding:10px 6px;font-size:13px;text-align:center;border-bottom:1px solid #eee;}
  tr:last-child td{border-bottom:none;}
  .pessoa{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .atualizado{text-align:center;color:#888;font-size:12px;margin:10px 0;}
  .vazio{text-align:center;color:#999;padding:30px 0;font-size:14px;}
</style>
</head>
<body>
<!-- SPLASH -->
<div id="splash">
  <img src="icon-512.png" alt="Controle PIX">
  <p>Controle PIX</p>
</div>
<header>
  <div class="header-top">
    <div>
      <h1>💰 Controle PIX</h1>
      <p>Pessoa física · Leonardo · dados atualizados automaticamente</p>
    </div>
    <button id="btnOlho" onclick="toggleOlho()" title="Mostrar/ocultar valores">👁️</button>
  </div>
</header>
<nav class="tabs">
  <button data-aba="dashboard" class="ativo">📊 Dashboard</button>
  <button data-aba="Nubank">🟣 Nubank</button>
  <button data-aba="XP">🟡 XP</button>
  <button data-aba="Todas">📋 Todas</button>
  <button data-aba="relatorios">📈 Relatórios</button>
</nav>
<main id="app"></main>
<script>
const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let dados = [];
let abaAtual = 'dashboard';
let filtro = 'Todos';
let oculto = localStorage.getItem('pix_oculto') === '1';
let relPeriodo = 'mensal';
let relMes = '';
let relAno = '';
let relBanco = 'Todos';
let relTipo = 'Todos';
const fmtMoeda = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtValor = v => oculto ? 'R$ ••••' : fmtMoeda(v);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const somar = (arr,tipo) => arr.filter(t=>t.tipo===tipo).reduce((s,t)=>s+t.valor,0);
const filtroOk = t => filtro==='Todos' || t.tipo===filtro;
const nomeMes = mesAno => { const [m,a]=mesAno.split('/'); return MESES_NOME[parseInt(m)-1]+' '+a; };
function atualizarOlho(){
  const b = document.getElementById('btnOlho');
  if(b) b.textContent = oculto ? '🙈' : '👁️';
}
function toggleOlho(){
  oculto = !oculto;
  localStorage.setItem('pix_oculto', oculto ? '1' : '0');
  atualizarOlho();
  render();
}
function htmlFiltros(){
  return ['Todos','Recebido','Pago'].map(f=>
    `<button class="${filtro===f?'ativo':''}" onclick="setFiltro('${f}')">${f}</button>`).join('');
}
function htmlDashboard(){
  const rec = somar(dados,'Recebido'), pag = somar(dados,'Pago');
  const max = Math.max(...dados.map(t=>t.valor), 1);
  let bancos = '';
  for(const b of ['Nubank','XP']){
    const arr = dados.filter(t=>t.banco===b);
    const r = somar(arr,'Recebido'), p = somar(arr,'Pago');
    bancos += `<div class="card-banco"><h2>${b}</h2>
      <div class="linhas"><span>Recebido</span><strong class="verde">${fmtValor(r)}</strong></div>
      <div class="linhas"><span>Pago</span><strong class="vermelho">${fmtValor(p)}</strong></div>
      <div class="linhas"><span>Saldo</span><strong class="${r-p>=0?'verde':'vermelho'}">${fmtValor(r-p)}</strong></div>
      <div class="grafico">
        <div class="barra-linha"><span class="rot">Recebido</span><div class="barra" style="width:${Math.max(2,(r/max)*100)}%;background:var(--verde)"></div></div>
        <div class="barra-linha"><span class="rot">Pago</span><div class="barra" style="width:${Math.max(2,(p/max)*100)}%;background:var(--vermelho)"></div></div>
      </div></div>`;
  }
  return `<div class="cards">
    <div class="card"><div class="rotulo">Recebido</div><div class="valor verde">${fmtValor(rec)}</div></div>
    <div class="card"><div class="rotulo">Pago</div><div class="valor vermelho">${fmtValor(pag)}</div></div>
    <div class="card"><div class="rotulo">Saldo Líquido</div><div class="valor azul">${fmtValor(rec-pag)}</div></div>
  </div>${bancos}`;
}
function htmlTabela(arr, titulo, comBanco){
  const cab = `<tr><th>Data</th><th>Horário</th>${comBanco?'<th>Banco</th>':''}<th>Tipo</th><th>Valor</th><th>Pessoa</th></tr>`;
  const linhas = arr.map(t=>`<tr>
    <td>${t.data}</td><td>${t.hora}</td>
    ${comBanco?`<td>${t.banco}</td>`:''}
    <td class="${t.tipo==='Recebido'?'verde':'vermelho'}">${t.tipo}</td>
    <td>${fmtValor(t.valor)}</td>
    <td class="pessoa" title="${esc(t.pessoa)}">${esc(t.pessoa)||'—'}</td></tr>`).join('');
  if(!arr.length) return `<div class="vazio">Nenhuma transação.</div>`;
  return `<table><thead>${cab}</thead><tbody>${linhas}</tbody></table>`;
}
function listaMeses(){
  const set = new Set(dados.map(t=>t.mes_ano).filter(Boolean));
  return [...set].sort();
}
function listaAnos(){
  const set = new Set(dados.map(t=>t.ano).filter(Boolean));
  return [...set].sort();
}
function htmlRelatorio(){
  if(!dados.length) return `<div class="relatorio"><div class="vazio">Nenhuma transação.</div></div>`;
  if(!relMes) relMes = listaMeses().pop();
  if(!relAno) relAno = listaAnos().pop();
  const arr = dados.filter(t=>{
    if(relPeriodo==='mensal' && t.mes_ano!==relMes) return false;
    if(relPeriodo==='anual' && t.ano!==relAno) return false;
    if(relBanco!=='Todos' && t.banco!==relBanco) return false;
    if(relTipo!=='Todos' && t.tipo!==relTipo) return false;
    return true;
  });
  const rec = somar(arr,'Recebido'), pag = somar(arr,'Pago');
  const opcoesPeriodo = relPeriodo==='mensal'
    ? listaMeses().map(m=>`<option value="${m}" ${m===relMes?'selected':''}>${nomeMes(m)}</option>`).join('')
    : listaAnos().map(a=>`<option value="${a}" ${a===relAno?'selected':''}>${a}</option>`).join('');
  return `<div class="relatorio">
    <div class="periodo-toggle">
      <button class="${relPeriodo==='mensal'?'ativo':''}" onclick="setPeriodo('mensal')">📅 Mensal</button>
      <button class="${relPeriodo==='anual'?'ativo':''}" onclick="setPeriodo('anual')">📆 Anual</button>
    </div>
    <div class="filtro">
      <select onchange="mudarPeriodo(this.value)">${opcoesPeriodo}</select>
      <select onchange="mudarBanco(this.value)">
        <option value="Todos" ${relBanco==='Todos'?'selected':''}>Todos bancos</option>
        <option value="Nubank" ${relBanco==='Nubank'?'selected':''}>Nubank</option>
        <option value="XP" ${relBanco==='XP'?'selected':''}>XP</option>
      </select>
      <select onchange="mudarTipo(this.value)">
        <option value="Todos" ${relTipo==='Todos'?'selected':''}>Todos tipos</option>
        <option value="Recebido" ${relTipo==='Recebido'?'selected':''}>Recebido</option>
        <option value="Pago" ${relTipo==='Pago'?'selected':''}>Pago</option>
      </select>
    </div>
    <div class="cards">
      <div class="card"><div class="rotulo">Recebido</div><div class="valor verde">${fmtValor(rec)}</div></div>
      <div class="card"><div class="rotulo">Pago</div><div class="valor vermelho">${fmtValor(pag)}</div></div>
      <div class="card"><div class="rotulo">Saldo</div><div class="valor ${rec-pag>=0?'verde':'vermelho'}">${fmtValor(rec-pag)}</div></div>
    </div>
    ${htmlTabela(arr,'Relatório',true)}
  </div>`;
}
function setPeriodo(p){
  relPeriodo = p;
  if(p==='mensal' && !relMes) relMes = listaMeses().pop();
  if(p==='anual' && !relAno) relAno = listaAnos().pop();
  render();
}
function mudarPeriodo(v){ relPeriodo==='mensal' ? relMes=v : relAno=v; render(); }
function mudarBanco(v){ relBanco=v; render(); }
function mudarTipo(v){ relTipo=v; render(); }
function render(){
  const app = document.getElementById('app');
  if(abaAtual==='dashboard') app.innerHTML = htmlDashboard();
  else if(abaAtual==='relatorios') app.innerHTML = htmlRelatorio();
  else if(abaAtual==='Todas') app.innerHTML = `<div class="filtro">${htmlFiltros()}</div>` + htmlTabela(dados.filter(filtroOk),'Todas',true);
  else app.innerHTML = `<div class="filtro">${htmlFiltros()}</div>` + htmlTabela(dados.filter(t=>t.banco===abaAtual && filtroOk(t)),abaAtual,false);
}
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{ abaAtual = b.dataset.aba; filtro='Todos';
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('ativo',x===b));
    render(); };
});
function setFiltro(f){ filtro=f; render(); }
async function carregarDados(){
  try{
    const resp = await fetch('dados_pix.json', {cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const arr = await resp.json();
    if(Array.isArray(arr) && arr.length){ dados = arr; }
  }catch(e){
    try{ const s = localStorage.getItem('dados_pix'); if(s){ dados = JSON.parse(s); } }catch(_){}
  }
  atualizarOlho();
  render();
  setTimeout(()=>{ const sp = document.getElementById('splash'); if(sp) sp.classList.add('oculto'); }, 400);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
carregarDados();
</script>
</body>
</html>
